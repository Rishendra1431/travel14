<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderShare - Travel Community & AI Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            overflow-x: hidden;
        }
        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "htm": "https://esm.sh/htm@3.1.1",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useState, useMemo, useEffect } from 'react';
        import ReactDOM from 'react-dom/client';
        import htm from 'htm';
        import { GoogleGenAI, Type } from '@google/genai';
        import { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell 
        } from 'recharts';

        const html = htm.bind(React.createElement);

        // --- ICONS ---
        const ICONS = {
            explore: "M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m6 13l5.447-2.724A1 1 0 0021 16.382V5.618a1 1 0 00-1.447-.894L15 7m-6 13V7m6 13V7",
            add: "M12 4v16m8-8H4",
            ai: "M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-7.714 2.143L11 21l-2.286-6.857L1 12l7.714-2.143L11 3z",
            info: "M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z",
            profile: "M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z",
            phone: "M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z",
            email: "M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z",
            camera: "M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z M15 13a3 3 0 11-6 0 3 3 0 016 0z"
        };

        const Icon = ({ name, className = "w-5 h-5" }) => html`
            <svg className=${className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d=${ICONS[name]} />
            </svg>
        `;

        const INITIAL_ENTRIES = [
            { id: 'e1', type: 'place', name: 'Ha Long Bay', location: 'Vietnam', rating: 5, budget: 180, experience: 'Absolutely breathtaking limestone karsts. The sunrise over the water is a core memory.', user: 'Alex', img: 'https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&q=80&w=800', tags: ['Scenic', 'Nature'] },
            { id: 'e2', type: 'hotel', name: 'Park Hyatt Tokyo', location: 'Japan', rating: 5, budget: 750, experience: 'Legendary views of Mt. Fuji. High-end but worth the splurge for the atmosphere.', user: 'Sarah', img: 'https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&q=80&w=800', tags: ['Luxury', 'City View'] },
            { id: 'e3', type: 'place', name: 'The Pantheon', location: 'Rome, Italy', rating: 5, budget: 20, experience: 'Still the largest unreinforced concrete dome. Standing under the oculus is surreal.', user: 'Marcus', img: 'https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&q=80&w=800', tags: ['History', 'Culture'] },
            { id: 'e4', type: 'hotel', name: 'Riad Be Marrakech', location: 'Morocco', rating: 5, budget: 150, experience: 'Intricate tilework and calm atmosphere. A perfect oasis in the busy medina.', user: 'Alex', img: 'https://images.unsplash.com/photo-1539367628448-4bc5c9d171c8?auto=format&fit=crop&q=80&w=800', tags: ['Boutique', 'Design'] }
        ];

        // --- COMPONENTS ---

        const EntryCard = ({ entry }) => html`
            <div className="bg-white rounded-[2.5rem] border border-gray-50 overflow-hidden shadow-sm hover:shadow-xl transition-all group animate-in">
                <div className="h-60 relative overflow-hidden">
                    <img src=${entry.img} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                    <div className=${`absolute top-4 left-4 backdrop-blur-md px-4 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider shadow-sm ${entry.type === 'hotel' ? 'bg-indigo-600/80 text-white' : 'bg-emerald-600/80 text-white'}`}>
                        ${entry.type}
                    </div>
                    <div className="absolute top-4 right-4 bg-white/90 backdrop-blur px-2 py-1 rounded-xl text-xs font-bold shadow-lg">★ ${entry.rating}</div>
                </div>
                <div className="p-8">
                    <div className="flex justify-between items-start mb-2">
                        <h3 className="font-bold text-xl leading-tight line-clamp-1">${entry.name}</h3>
                        <span className="text-blue-600 font-bold">$${entry.budget}</span>
                    </div>
                    <p className="text-gray-400 text-[10px] mb-4 uppercase tracking-widest font-extrabold">${entry.location}</p>
                    <p className="text-gray-600 text-sm italic line-clamp-2 leading-relaxed">"${entry.experience}"</p>
                    <div className="mt-8 flex items-center gap-3 border-t pt-6 border-gray-50">
                        <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-xs font-bold text-blue-600">
                            ${entry.user?.charAt(0) || 'U'}
                        </div>
                        <span className="text-xs font-bold text-gray-500 uppercase tracking-tighter">Shared by ${entry.user}</span>
                    </div>
                </div>
            </div>
        `;

        const ExploreView = ({ entries }) => {
            const [search, setSearch] = useState('');
            const filtered = entries.filter(e => e.name.toLowerCase().includes(search.toLowerCase()) || e.location.toLowerCase().includes(search.toLowerCase()));
            const trending = entries.slice(0, 3);

            return html`
                <div className="max-w-6xl mx-auto px-6 py-10 animate-in">
                    <div className="mb-12">
                        <h2 className="text-2xl font-bold text-gray-900 flex items-center gap-3 mb-6">
                            <span className="w-2 h-8 bg-blue-600 rounded-full"></span>
                            Trending This Week
                        </h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${trending.map(dest => html`
                                <div key=${dest.id} className="relative h-80 rounded-[2.5rem] overflow-hidden group shadow-xl cursor-pointer">
                                    <img src=${dest.img} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent p-6 flex flex-col justify-end">
                                        <div className="flex gap-2 mb-3">
                                            ${dest.tags?.slice(0, 2).map(tag => html`
                                                <span key=${tag} className="text-[9px] px-2.5 py-1 bg-white/20 backdrop-blur-md text-white rounded-full border border-white/20 uppercase font-bold tracking-widest">
                                                    ${tag}
                                                </span>
                                            `)}
                                        </div>
                                        <span className="text-blue-400 text-[10px] font-bold uppercase tracking-widest mb-1">${dest.location}</span>
                                        <h3 className="text-white text-2xl font-bold leading-tight drop-shadow-md">${dest.name}</h3>
                                    </div>
                                </div>
                            `)}
                        </div>
                    </div>

                    <header className="mb-10 mt-16 text-center md:text-left">
                        <h1 className="text-3xl font-extrabold mb-3 tracking-tight">Community Discoveries</h1>
                        <p className="text-gray-500 max-w-lg">Browse vetted memories from around the globe.</p>
                    </header>

                    <div className="relative mb-12">
                        <input className="w-full p-6 pl-14 rounded-[2rem] border border-gray-100 shadow-sm focus:ring-4 focus:ring-blue-50 outline-none text-lg transition-all" 
                               placeholder="Search location, hotel or landmark..." value=${search} onChange=${e => setSearch(e.target.value)} />
                        <div className="absolute left-6 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                        ${filtered.map(entry => html`<${EntryCard} key=${entry.id} entry=${entry} />`)}
                    </div>
                </div>
            `;
        };

        const AddEntryView = ({ onAdd }) => {
            const [form, setForm] = useState({ type: 'place', name: '', location: '', budget: '', experience: '', rating: 5 });
            const submit = (e) => {
                e.preventDefault();
                onAdd({ ...form, id: Date.now().toString(), img: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&q=80&w=800', user: 'You', tags: ['New'] });
                alert('Experience published!');
            };
            return html`
                <div className="max-w-xl mx-auto px-6 py-10 animate-in">
                    <h1 className="text-3xl font-extrabold mb-8 text-center">Share Your Story</h1>
                    <form onSubmit=${submit} className="bg-white rounded-[3rem] p-10 border border-gray-50 shadow-sm space-y-8">
                        <div className="flex gap-2 p-1.5 bg-gray-50 rounded-2xl w-fit mx-auto">
                            <button type="button" onClick=${() => setForm({...form, type: 'place'})} className=${`px-8 py-3 rounded-xl text-xs font-bold transition-all ${form.type === 'place' ? 'bg-white shadow-sm text-emerald-600' : 'text-gray-400'}`}>Visited Place</button>
                            <button type="button" onClick=${() => setForm({...form, type: 'hotel'})} className=${`px-8 py-3 rounded-xl text-xs font-bold transition-all ${form.type === 'hotel' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-400'}`}>Hotel Stay</button>
                        </div>
                        <div className="space-y-4">
                            <input required className="w-full p-5 bg-gray-50 rounded-2xl border-none focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Name" value=${form.name} onChange=${e => setForm({...form, name: e.target.value})} />
                            <input required className="w-full p-5 bg-gray-50 rounded-2xl border-none focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Location" value=${form.location} onChange=${e => setForm({...form, location: e.target.value})} />
                            <div className="flex gap-4">
                                <input required type="number" className="flex-1 p-5 bg-gray-50 rounded-2xl border-none focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Cost ($)" value=${form.budget} onChange=${e => setForm({...form, budget: e.target.value})} />
                                <select className="w-40 p-5 bg-gray-50 rounded-2xl border-none focus:ring-2 focus:ring-blue-500 outline-none" value=${form.rating} onChange=${e => setForm({...form, rating: Number(e.target.value)})}>
                                    ${[5,4,3,2,1].map(n => html`<option key=${n} value=${n}>${n} Stars</option>`)}
                                </select>
                            </div>
                            <textarea required rows="4" className="w-full p-5 bg-gray-50 rounded-2xl border-none focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="Experience..." value=${form.experience} onChange=${e => setForm({...form, experience: e.target.value})} />
                            
                            <div className="p-10 border-2 border-dashed border-gray-100 rounded-[2rem] flex flex-col items-center justify-center text-gray-400 hover:border-blue-400 hover:text-blue-500 cursor-pointer transition-all">
                                <${Icon} name="camera" className="w-8 h-8" />
                                <p className="mt-2 text-sm font-medium">Upload Photos</p>
                            </div>
                        </div>
                        <button type="submit" className="w-full py-5 bg-blue-600 text-white rounded-2xl font-bold shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all">Publish Story</button>
                    </form>
                </div>
            `;
        };

        const AIPlannerView = () => {
            const [dest, setDest] = useState('');
            const [days, setDays] = useState(3);
            const [budget, setBudget] = useState('moderate');
            const [loading, setLoading] = useState(false);
            const [plan, setPlan] = useState(null);
            
            const run = async () => {
                if(!dest) return;
                setLoading(true);
                try {
                    const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
                    const res = await ai.models.generateContent({
                        model: 'gemini-3-flash-preview',
                        contents: `Plan a ${days}-day trip to ${dest} for a ${budget} budget. Return JSON object with "title", "summary", "totalBudget", and "days" (each day has "day", "activities" array, "hotelSuggestion", "estimatedCost").`,
                        config: { 
                            responseMimeType: "application/json", 
                            responseSchema: { 
                                type: Type.OBJECT, 
                                properties: { 
                                    title: { type: Type.STRING }, 
                                    summary: { type: Type.STRING },
                                    totalBudget: { type: Type.NUMBER },
                                    days: { 
                                        type: Type.ARRAY, 
                                        items: { 
                                            type: Type.OBJECT, 
                                            properties: { 
                                                day: { type: Type.NUMBER }, 
                                                activities: { type: Type.ARRAY, items: { type: Type.STRING } },
                                                hotelSuggestion: { type: Type.STRING },
                                                estimatedCost: { type: Type.NUMBER }
                                            },
                                            required: ["day", "activities", "estimatedCost"]
                                        } 
                                    } 
                                },
                                required: ["title", "summary", "totalBudget", "days"]
                            } 
                        }
                    });
                    setPlan(JSON.parse(res.text));
                } catch(e) { 
                    alert('AI Generation failed. Check your destination and try again.'); 
                    console.error(e);
                } finally { 
                    setLoading(false); 
                }
            };

            return html`
                <div className="max-w-2xl mx-auto px-6 py-10 animate-in">
                    <div className="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-[3rem] p-12 text-white mb-10 shadow-2xl relative overflow-hidden">
                        <div className="relative z-10">
                            <h2 className="text-3xl font-extrabold mb-3 flex items-center gap-4"><${Icon} name="ai" className="w-8 h-8" /> AI Smart Planner</h2>
                            <p className="opacity-80 text-lg">Instant itineraries built from community wisdom.</p>
                        </div>
                        <div className="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -mr-32 -mt-32"></div>
                    </div>
                    
                    <div className="bg-white rounded-[2.5rem] p-10 border border-gray-50 shadow-sm space-y-8">
                        <div className="space-y-4">
                            <label className="text-sm font-extrabold text-gray-400 uppercase tracking-widest">Where to?</label>
                            <input className="w-full p-6 bg-gray-50 rounded-2xl border-none focus:ring-4 focus:ring-indigo-50 outline-none text-lg transition-all" 
                                   placeholder="e.g. Rome, Tokyo" value=${dest} onChange=${e => setDest(e.target.value)} />
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="space-y-4">
                                <label className="text-sm font-extrabold text-gray-400 uppercase tracking-widest">Duration (Days)</label>
                                <input type="number" min="1" max="14" className="w-full p-6 bg-gray-50 rounded-2xl border-none focus:ring-4 focus:ring-indigo-50 outline-none text-lg transition-all" 
                                       value=${days} onChange=${e => setDays(Number(e.target.value))} />
                            </div>
                            <div className="space-y-4">
                                <label className="text-sm font-extrabold text-gray-400 uppercase tracking-widest">Budget Level</label>
                                <div className="flex gap-2 p-1.5 bg-gray-50 rounded-2xl">
                                    ${['budget', 'moderate', 'luxury'].map(level => html`
                                        <button key=${level} onClick=${() => setBudget(level)} 
                                                className=${`flex-1 py-3 rounded-xl text-[10px] font-bold uppercase transition-all ${budget === level ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-400 hover:text-gray-600'}`}>
                                            ${level}
                                        </button>
                                    `)}
                                </div>
                            </div>
                        </div>

                        <button onClick=${run} disabled=${loading || !dest} className=${`w-full py-5 rounded-2xl font-bold transition-all shadow-xl flex items-center justify-center gap-3 ${loading ? 'bg-gray-100 text-gray-400 shadow-none' : 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-indigo-100'}`}>
                            ${loading ? html`<span className="w-5 h-5 border-2 border-indigo-400 border-t-indigo-600 rounded-full animate-spin"></span> Generating...` : 'Create My Trip'}
                        </button>
                    </div>

                    ${plan && html`
                        <div className="mt-12 space-y-10 animate-in">
                            <div className="border-l-8 border-indigo-600 pl-6">
                                <h3 className="text-3xl font-extrabold text-gray-900">${plan.title}</h3>
                                <p className="text-gray-500 mt-2 text-lg italic leading-relaxed">"${plan.summary}"</p>
                                <div className="mt-6 flex gap-4">
                                    <div className="bg-blue-50 text-blue-700 px-5 py-2.5 rounded-2xl text-xs font-bold border border-blue-100 shadow-sm">
                                        Total Est: $${plan.totalBudget}
                                    </div>
                                    <div className="bg-indigo-50 text-indigo-700 px-5 py-2.5 rounded-2xl text-xs font-bold border border-indigo-100 shadow-sm capitalize">
                                        ${budget} Style
                                    </div>
                                </div>
                            </div>
                            <div className="space-y-8 relative">
                                <div className="absolute left-[20px] top-10 bottom-10 w-1 bg-gradient-to-b from-indigo-100 via-blue-50 to-indigo-100 rounded-full"></div>
                                ${plan.days.map(d => html`
                                    <div key=${d.day} className="bg-white p-10 rounded-[3rem] border border-gray-100 shadow-sm relative group hover:shadow-xl hover:shadow-blue-50/50 transition-all">
                                        <div className="absolute -left-5 top-10 w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-sm font-bold text-white shadow-xl rotate-3 group-hover:rotate-0 transition-transform">
                                            ${d.day}
                                        </div>
                                        <div className="flex justify-between items-center mb-8 ml-8">
                                            <h4 className="font-extrabold text-2xl text-gray-900">Day ${d.day}</h4>
                                            <span className="text-[10px] font-extrabold text-indigo-400 uppercase tracking-widest bg-indigo-50 px-4 py-1.5 rounded-full">$${d.estimatedCost} Estimated</span>
                                        </div>
                                        <ul className="space-y-5 text-gray-700 ml-8">
                                            ${d.activities.map((ev, i) => html`<li key=${i} className="flex gap-5 items-start"><span className="w-2 h-2 rounded-full bg-indigo-400 mt-2.5 shadow-sm"></span> <span className="text-base font-medium leading-relaxed">${ev}</span></li>`)}
                                        </ul>
                                        ${d.hotelSuggestion && html`
                                            <div className="mt-8 ml-8 pt-8 border-t border-gray-50 flex items-center gap-6">
                                                <div className="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center shadow-inner"><${Icon} name="explore" /></div>
                                                <div>
                                                    <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Stay Recommendation</p>
                                                    <p className="text-lg font-extrabold text-gray-800">${d.hotelSuggestion}</p>
                                                </div>
                                            </div>
                                        `}
                                    </div>
                                `)}
                            </div>
                        </div>
                    `}
                </div>
            `;
        };

        const LocalInfoView = () => {
            const data = {
                helplines: ['9581755824', '9059795715'],
                emails: ['rishiyasar123@gmail.com', 'vinayk2046@gmail.com'],
                guides: [{ name: 'Karthik', phone: '9398516955' }, { name: 'Keerthan', phone: '8247085073' }]
            };
            return html`
                <div className="max-w-4xl mx-auto px-6 py-10 animate-in">
                    <header className="mb-12 text-center">
                        <h1 className="text-3xl font-extrabold mb-3">Support & Guides</h1>
                        <p className="text-gray-500">Verified essential contacts for your global adventures.</p>
                    </header>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="bg-white p-10 rounded-[3rem] border border-red-50 shadow-sm">
                            <h2 className="text-xl font-bold text-red-600 mb-6 flex items-center gap-3"><${Icon} name="phone" /> 24/7 Helplines</h2>
                            <div className="space-y-4">
                                ${data.helplines.map(n => html`<a key=${n} href="tel:${n}" className="flex justify-between items-center p-5 bg-red-50/30 rounded-2xl font-bold text-red-700 hover:bg-red-50 transition-colors"><span>${n}</span><span className="text-[10px] bg-white px-3 py-1 rounded-full shadow-sm">CALL NOW</span></a>`)}
                            </div>
                        </div>
                        <div className="bg-white p-10 rounded-[3rem] border border-blue-50 shadow-sm">
                            <h2 className="text-xl font-bold text-blue-600 mb-6 flex items-center gap-3"><${Icon} name="email" /> Verification Desk</h2>
                            <div className="space-y-4">
                                ${data.emails.map(e => html`<a key=${e} href="mailto:${e}" className="flex justify-between items-center p-5 bg-blue-50/30 rounded-2xl font-bold text-blue-700 hover:bg-blue-50 transition-colors"><span className="truncate">${e}</span><span className="text-[10px] bg-white px-3 py-1 rounded-full shadow-sm">EMAIL</span></a>`)}
                            </div>
                        </div>
                        <div className="md:col-span-2 bg-white p-10 rounded-[3rem] border border-emerald-50 shadow-sm">
                            <h2 className="text-xl font-bold text-emerald-600 mb-10 flex items-center gap-3"><${Icon} name="profile" /> Verified Local Experts</h2>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-8">
                                ${data.guides.map(g => html`
                                    <div key=${g.name} className="flex justify-between items-center p-8 bg-emerald-50/20 rounded-[2.5rem] border border-emerald-100">
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 font-bold text-xl">${g.name.charAt(0)}</div>
                                            <div><p className="font-bold text-lg text-gray-900">${g.name}</p><p className="text-xs text-emerald-600 font-bold uppercase tracking-widest">Travel Expert</p></div>
                                        </div>
                                        <a href="tel:${g.phone}" className="p-4 bg-white rounded-2xl text-emerald-600 shadow-sm hover:bg-emerald-600 hover:text-white transition-all"><${Icon} name="phone" /></a>
                                    </div>
                                `)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        const ProfileView = ({ entries }) => {
            const myEntries = entries.filter(e => e.user === 'Alex' || e.user === 'You');
            const totalSpent = myEntries.reduce((sum, e) => sum + Number(e.budget), 0);
            
            // Recharts needs data that is always an array
            const chartData = useMemo(() => {
                return myEntries.length > 0 
                    ? myEntries.map(e => ({ name: e.name, budget: Number(e.budget) })) 
                    : [{ name: 'None', budget: 0 }];
            }, [myEntries]);

            return html`
                <div className="max-w-6xl mx-auto px-6 py-10 animate-in">
                    <div className="flex flex-col lg:flex-row gap-12 items-start">
                        <div className="w-full lg:w-1/3 space-y-8">
                            <div className="bg-white p-12 rounded-[4rem] border border-gray-100 shadow-sm text-center">
                                <div className="w-40 h-40 rounded-full mx-auto bg-gradient-to-tr from-blue-100 to-blue-50 border-8 border-white shadow-2xl mb-8 flex items-center justify-center text-5xl font-extrabold text-blue-600 overflow-hidden">
                                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Alex" className="w-full h-full object-cover" />
                                </div>
                                <h2 className="text-3xl font-extrabold text-gray-900">Alex Rivera</h2>
                                <p className="text-gray-400 text-sm mt-1 font-medium italic">"Mapping the globe, one city at a time."</p>
                                <div className="flex justify-center gap-10 py-8 border-y my-8 border-gray-50">
                                    <div><p className="text-2xl font-extrabold text-gray-900">${myEntries.length}</p><p className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Logs</p></div>
                                    <div><p className="text-2xl font-extrabold text-gray-900">12</p><p className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Badges</p></div>
                                </div>
                                <button className="w-full py-4 bg-gray-50 border border-gray-100 rounded-2xl text-xs font-bold uppercase tracking-widest text-gray-400 hover:bg-blue-600 hover:text-white transition-all">Journey Settings</button>
                            </div>
                            <div className="bg-white p-10 rounded-[3rem] border border-gray-100 shadow-sm h-80 overflow-hidden">
                                <h3 className="font-extrabold text-[10px] uppercase tracking-widest mb-8 text-gray-400">Spending Statistics (USD)</h3>
                                <div className="h-48">
                                    <${ResponsiveContainer} width="100%" height="100%">
                                        <${BarChart} data=${chartData}>
                                            <${CartesianGrid} strokeDasharray="3 3" vertical=${false} stroke="#f1f5f9" />
                                            <${XAxis} dataKey="name" hide />
                                            <${YAxis} fontSize=${10} tickLine=${false} axisLine=${false} />
                                            <${Tooltip} cursor=${{fill: '#f8fafc'}} contentStyle=${{borderRadius: '24px', border: 'none', boxShadow: '0 10px 30px rgba(0,0,0,0.05)'}} />
                                            <${Bar} dataKey="budget" fill="#3b82f6" radius=${[10, 10, 0, 0]} />
                                        <//>
                                    <//>
                                </div>
                                <p className="text-center text-[10px] font-extrabold text-gray-900 uppercase tracking-widest mt-6">Total: $${totalSpent}</p>
                            </div>
                        </div>
                        <div className="w-full lg:w-2/3">
                            <h3 className="text-2xl font-extrabold mb-10 text-gray-900">My Travel History</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                ${myEntries.map(e => html`<${EntryCard} key=${e.id} entry=${e} />`)}
                                ${myEntries.length === 0 && html`
                                    <div className="col-span-full py-20 bg-gray-50 rounded-[3rem] border-4 border-dashed border-gray-100 text-center">
                                        <p className="text-gray-400 font-bold italic">No stories shared yet.</p>
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('explore');
            const [entries, setEntries] = useState(INITIAL_ENTRIES);

            const handleAdd = (entry) => {
                setEntries([entry, ...entries]);
                setActiveTab('explore');
            };

            return html`
                <div className="min-h-screen pb-24 md:pt-16">
                    <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-2xl border-t border-gray-100 z-50 md:top-0 md:bottom-auto md:border-b">
                        <div className="max-w-6xl mx-auto px-8 h-20 flex items-center justify-around md:justify-between">
                            <div className="hidden md:flex items-center gap-3 font-extrabold text-blue-600 text-2xl cursor-pointer group" onClick=${() => setActiveTab('explore')}>
                                <div className="p-2.5 bg-blue-600 text-white rounded-2xl shadow-xl shadow-blue-200 group-hover:scale-110 transition-transform"><${Icon} name="explore" /></div>
                                <span className="tracking-tighter">WanderShare</span>
                            </div>
                            <div className="flex w-full md:w-auto justify-around gap-2 md:gap-10">
                                ${[
                                    { id: 'explore', label: 'Explore', icon: 'explore' },
                                    { id: 'add', label: 'Share', icon: 'add' },
                                    { id: 'ai', label: 'AI Plan', icon: 'ai' },
                                    { id: 'info', label: 'Support', icon: 'info' },
                                    { id: 'profile', label: 'Profile', icon: 'profile' }
                                ].map(item => html`
                                    <button key=${item.id} onClick=${() => setActiveTab(item.id)} className=${`flex flex-col items-center gap-1.5 min-w-[60px] transition-all relative ${activeTab === item.id ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
                                        <${Icon} name=${item.icon} />
                                        <span className="text-[9px] font-extrabold uppercase tracking-widest">${item.label}</span>
                                        ${activeTab === item.id && html`<div className="absolute -bottom-1 w-5 h-1 bg-blue-600 rounded-full animate-in"></div>`}
                                    </button>
                                `)}
                            </div>
                        </div>
                    </nav>

                    <main className="animate-in">
                        ${activeTab === 'explore' && html`<${ExploreView} entries=${entries} />`}
                        ${activeTab === 'add' && html`<${AddEntryView} onAdd=${handleAdd} />`}
                        ${activeTab === 'ai' && html`<${AIPlannerView} />`}
                        ${activeTab === 'info' && html`<${LocalInfoView} />`}
                        ${activeTab === 'profile' && html`<${ProfileView} entries=${entries} />`}
                    </main>

                    <!-- Background Decorative Blurs -->
                    <div className="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
                        <div className="absolute top-0 right-0 w-[1000px] h-[1000px] bg-gradient-to-br from-blue-100/40 to-indigo-50/40 rounded-full blur-[140px] -mr-[300px] -mt-[300px]"></div>
                        <div className="absolute bottom-0 left-0 w-[800px] h-[800px] bg-gradient-to-tr from-indigo-100/40 to-blue-50/40 rounded-full blur-[120px] -ml-[200px] -mb-[200px]"></div>
                    </div>
                </div>
            `;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
